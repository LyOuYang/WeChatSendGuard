[package]
name = "wechat-send-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Windows and macOS desktop application for WeChatSendGuard."

[[bin]]
name = "WeChatSendGuard"
path = "src/main.rs"

[dependencies]
slint.workspace = true
raw-window-handle.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
zip.workspace = true
wechat-send-guard-core = { path = "../guard-core" }
wechat-send-guard-desktop-ui = { path = "../desktop-ui" }
wechat-send-guard-platform-api = { path = "../platform-api" }
wechat-send-guard-service = { path = "../guard-service" }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
wechat-send-guard-platform-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
wechat-send-guard-platform-macos = { path = "../platform-macos" }

[build-dependencies]
winresource = "0.1"
