[workspace]
members = [
    "crates/guard-core",
    "crates/guard-service",
    "crates/platform-api",
    "crates/platform-windows",
    "crates/platform-macos",
    "crates/desktop-ui",
    "crates/desktop-app",
]
default-members = [
    "crates/guard-core",
    "crates/guard-service",
    "crates/platform-api",
    "crates/platform-windows",
    "crates/platform-macos",
    "crates/desktop-ui",
    "crates/desktop-app",
]
resolver = "3"

[workspace.package]
version = "1.3.1"
edition = "2024"
rust-version = "1.92"
license = "Proprietary"
authors = ["WeChatSendGuard contributors"]

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.28"
sha2 = "0.10.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "system-tray",
] }
