[workspace]
members = [
    "crates/guard-core",
    "crates/guard-service",
    "crates/platform-api",
    "crates/platform-windows",
    "crates/desktop-ui",
    "crates/desktop-app",
]
default-members = [
    "crates/guard-core",
    "crates/guard-service",
    "crates/platform-api",
    "crates/platform-windows",
    "crates/desktop-ui",
    "crates/desktop-app",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Proprietary"
authors = ["WeChatSendGuard contributors"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
    "system-tray",
] }
