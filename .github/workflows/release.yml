name: Release Windows and macOS packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
      - name: Validate tag, version, and main ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" != "push" ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$tag" == "v$version" ]] || { echo "Tag $tag does not match VERSION $version" >&2; exit 1; }
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wechat-send-guard") | .version')"
          [[ "$cargo_version" == "$version" ]] || { echo "Cargo version $cargo_version does not match VERSION $version" >&2; exit 1; }
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag must point to a commit on origin/main" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows release package
    runs-on: windows-2022
    needs: validate
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress --limit-output
      - name: Check formatting, lint, and tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build Windows installer
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}-windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
          if-no-files-found: error

  macos:
    name: macOS release package
    runs-on: macos-14
    needs: validate
    environment: production
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
      - name: Require production signing configuration
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          test -n "$MACOS_CODESIGN_IDENTITY" || { echo "Missing production secret MACOS_CODESIGN_IDENTITY" >&2; exit 1; }
          test -n "$MACOS_CERTIFICATE_P12_BASE64" || { echo "Missing production secret MACOS_CERTIFICATE_P12_BASE64" >&2; exit 1; }
          test -n "$MACOS_CERTIFICATE_PASSWORD" || { echo "Missing production secret MACOS_CERTIFICATE_PASSWORD" >&2; exit 1; }
          test -n "$MACOS_NOTARY_API_KEY_BASE64" || { echo "Missing production secret MACOS_NOTARY_API_KEY_BASE64" >&2; exit 1; }
          test -n "$MACOS_NOTARY_KEY_ID" || { echo "Missing production secret MACOS_NOTARY_KEY_ID" >&2; exit 1; }
          test -n "$MACOS_NOTARY_ISSUER_ID" || { echo "Missing production secret MACOS_NOTARY_ISSUER_ID" >&2; exit 1; }
      - name: Import notarization credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP/keychain-password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP/keychain-password" "$keychain"
          echo "$MACOS_NOTARY_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Check formatting, lint, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build, sign, notarize, and staple universal DMG
        env:
          MACOS_BUILD_KIND: universal
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: ./packaging/macos/build-app.sh
      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}-macos-universal
          path: |
            dist/macos/*.dmg
            dist/macos/*.dmg.sha256
          if-no-files-found: error

  publish:
    name: Publish unified GitHub Release
    runs-on: ubuntu-24.04
    needs: [validate, windows, macos]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}-windows-x64
          path: dist/windows
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.tag }}-macos-universal
          path: dist/macos
      - name: Validate release assets and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          win="dist/windows/WeChatSendGuard-Setup-$VERSION.exe"
          dmg="dist/macos/WeChatSendGuard-$VERSION-universal.dmg"
          test -f "$win" && test -f "$win.sha256"
          test -f "$dmg" && test -f "$dmg.sha256"
          (cd dist/windows && sha256sum -c "WeChatSendGuard-Setup-$VERSION.exe.sha256")
          (cd dist/macos && shasum -a 256 -c "WeChatSendGuard-$VERSION-universal.dmg.sha256")
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: WeChatSendGuard ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/WeChatSendGuard-Setup-${{ needs.validate.outputs.version }}.exe
            dist/windows/WeChatSendGuard-Setup-${{ needs.validate.outputs.version }}.exe.sha256
            dist/macos/WeChatSendGuard-${{ needs.validate.outputs.version }}-universal.dmg
            dist/macos/WeChatSendGuard-${{ needs.validate.outputs.version }}-universal.dmg.sha256
