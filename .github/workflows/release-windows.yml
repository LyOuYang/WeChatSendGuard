name: Build and release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches VERSION
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "Release tag '$tag' must exactly match VERSION 'v$version'."
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress --limit-output

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run automated tests
        run: cargo test --workspace

      - name: Build Windows installer
        shell: pwsh
        run: .\packaging\windows\build-installer.ps1

      - name: Create installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $installer = "dist/windows/WeChatSendGuard-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer was not produced at '$installer'."
          }
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  WeChatSendGuard-Setup-$version.exe" |
            Set-Content -LiteralPath "$installer.sha256" -Encoding ascii -NoNewline

      - name: Upload release files for review
        uses: actions/upload-artifact@v4
        with:
          name: WeChatSendGuard-windows-installer
          path: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WeChatSendGuard ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
